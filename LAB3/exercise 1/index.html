<!DOCTYPE html>
<html>
<head>
  <title>Adaptive Registration</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; }
    form { width: 400px; margin: 30px auto; background: #fff; padding: 20px; }
    input, select { width: 100%; padding: 8px; margin: 8px 0; }
    .error { border: 2px solid red; }
    .hidden { display: none; }
    small { color: red; }
  </style>
</head>
<body>

<form id="registerForm">
  <h2>Register</h2>

  <input type="text" id="name" placeholder="Name">
  <small id="nameErr"></small>

  <input type="email" id="email" placeholder="Email">
  <small id="emailErr"></small>

  <input type="password" id="password" placeholder="Password">
  <small id="passErr"></small>

  <input type="password" id="confirmPassword" placeholder="Confirm Password">
  <small id="confirmErr"></small>

  <input type="number" id="age" placeholder="Age">

  <select id="role">
    <option value="">Select Role</option>
    <option>Student</option>
    <option>Teacher</option>
    <option>Admin</option>
  </select>

  <input type="text" id="skills" class="hidden" placeholder="Skills (Teachers only)">

  <button type="submit">Register</button>
</form>

<script src="script.js"></script>
</body>
</html>
